workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"

default:
  interruptible: true

stages:
  - verify
  - package
  - release

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"

.install_js_deps: &install_js_deps
  - |
    if [ -f package-lock.json ]; then
      npm ci
    elif [ -f bun.lock ]; then
      npx --yes bun install --frozen-lockfile
    else
      npm install --no-audit
    fi

verify:web:
  stage: verify
  image: node:22-bookworm
  cache:
    key:
      files:
        - package-lock.json
        - bun.lock
    paths:
      - .npm/
  script:
    - *install_js_deps
    - npx tsc --noEmit
    - npm run lint
    - npm test
    - npm run build
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"

verify:rust:
  stage: verify
  image: ubuntu:22.04
  variables:
    DEBIAN_FRONTEND: noninteractive
  cache:
    key:
      files:
        - src-tauri/Cargo.toml
    paths:
      - .cargo/
      - src-tauri/target/
  before_script:
    - apt-get update
    - apt-get install -y
        ca-certificates
        curl
        wget
        file
        gnupg
        build-essential
        libwebkit2gtk-4.1-dev
        libxdo-dev
        libssl-dev
        libayatana-appindicator3-dev
        librsvg2-dev
    - mkdir -p /etc/apt/keyrings
    - curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
    - echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_22.x nodistro main" > /etc/apt/sources.list.d/nodesource.list
    - apt-get update && apt-get install -y nodejs
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --component clippy
    - export PATH="$CARGO_HOME/bin:$PATH"
  script:
    - export PATH="$CARGO_HOME/bin:$PATH"
    - node scripts/prepare-desktop.mjs --sidecar-only
    - mkdir -p src-tauri/standalone-server
    - touch src-tauri/standalone-server/.ci-placeholder
    - cargo check --manifest-path src-tauri/Cargo.toml --all-targets
    - cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
    - cargo test --manifest-path src-tauri/Cargo.toml
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"

package:web:
  stage: package
  image: node:22-bookworm
  needs:
    - verify:web
  cache:
    key:
      files:
        - package-lock.json
        - bun.lock
    paths:
      - .npm/
  script:
    - *install_js_deps
    - npm run build
    - mkdir -p dist-web
    - cp -r .next/standalone/. dist-web/
    - mkdir -p dist-web/.next
    - cp -r .next/static dist-web/.next/static
    - if [ -d public ]; then cp -r public dist-web/public; fi
    - tar -czf "comfynode-sentinel-web-${CI_COMMIT_REF_SLUG}.tar.gz" -C dist-web .
    - node scripts/extract-release-notes.mjs "${CI_COMMIT_TAG:-$CI_COMMIT_REF_NAME}" RELEASE_NOTES.md
  artifacts:
    name: "comfynode-sentinel-web-$CI_COMMIT_REF_SLUG"
    expire_in: 30 days
    paths:
      - dist-web/
      - comfynode-sentinel-web-*.tar.gz
      - RELEASE_NOTES.md
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true

package:linux:
  stage: package
  image: ubuntu:22.04
  needs:
    - verify:web
    - verify:rust
  variables:
    DEBIAN_FRONTEND: noninteractive
    APPIMAGE_EXTRACT_AND_RUN: "1"
  cache:
    key:
      files:
        - package-lock.json
        - src-tauri/Cargo.lock
    paths:
      - .npm/
      - .cargo/
      - src-tauri/target/
  before_script:
    - apt-get update
    - apt-get install -y
        ca-certificates
        curl
        wget
        file
        gnupg
        build-essential
        libwebkit2gtk-4.1-dev
        libxdo-dev
        libssl-dev
        libayatana-appindicator3-dev
        librsvg2-dev
    - mkdir -p /etc/apt/keyrings
    - curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
    - echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_22.x nodistro main" > /etc/apt/sources.list.d/nodesource.list
    - apt-get update && apt-get install -y nodejs
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
    - export PATH="$CARGO_HOME/bin:$PATH"
  script:
    - export PATH="$CARGO_HOME/bin:$PATH"
    - *install_js_deps
    - npm run tauri:build
  artifacts:
    name: "comfynode-sentinel-linux-$CI_COMMIT_REF_SLUG"
    expire_in: 30 days
    paths:
      - src-tauri/target/release/bundle/deb/*.deb
      - src-tauri/target/release/bundle/rpm/*.rpm
      - src-tauri/target/release/bundle/appimage/*.AppImage
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - when: manual
      allow_failure: true

release:gitlab:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: package:web
      artifacts: true
    - job: package:linux
      artifacts: true
  before_script:
    - apk add --no-cache curl coreutils
  script:
    - |
      PACKAGE_VERSION="${CI_COMMIT_TAG#v}"
      REGISTRY_BASE="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/comfynode-sentinel/${PACKAGE_VERSION}"
      mkdir -p release-upload

      for f in comfynode-sentinel-web-*.tar.gz; do
        [ -f "$f" ] && cp "$f" "release-upload/comfynode-sentinel-web-${CI_COMMIT_TAG}.tar.gz"
      done
      for f in src-tauri/target/release/bundle/deb/*.deb; do
        [ -f "$f" ] && cp "$f" "release-upload/comfynode-sentinel_${PACKAGE_VERSION}_amd64.deb"
      done
      for f in src-tauri/target/release/bundle/rpm/*.rpm; do
        [ -f "$f" ] && cp "$f" "release-upload/comfynode-sentinel-${PACKAGE_VERSION}-1.x86_64.rpm"
      done
      for f in src-tauri/target/release/bundle/appimage/*.AppImage; do
        [ -f "$f" ] && cp "$f" "release-upload/comfynode-sentinel_${PACKAGE_VERSION}_amd64.AppImage"
      done

      (
        cd release-upload
        sha256sum * > SHA256SUMS.txt
      )

      set -- release-cli create \
        --name "ComfyNode Sentinel ${CI_COMMIT_TAG}" \
        --tag-name "${CI_COMMIT_TAG}" \
        --ref "${CI_COMMIT_SHA}" \
        --description "RELEASE_NOTES.md"

      for file in release-upload/*; do
        filename=$(basename "$file")
        url="${REGISTRY_BASE}/${filename}"
        echo "Uploading ${filename} to ${url}..."
        curl --fail-with-body --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "${file}" "${url}"
        set -- "$@" --assets-link="{\"name\":\"${filename}\",\"url\":\"${url}\",\"filepath\":\"/${filename}\",\"link_type\":\"package\"}"
      done

      "$@"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
