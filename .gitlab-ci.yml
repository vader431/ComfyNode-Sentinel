# .gitlab-ci.yml - Tauri + Node.js Multi-Platform Pipeline
# Generated by CI Expert Agent v1

stages:
  - verify
  - package
  - build

# =============================================================================
# BASE JOBS (Shared Configuration)
# =============================================================================

# Base job for Ubuntu-based jobs with common setup
.base-ubuntu: &base_ubuntu
  image: ubuntu:22.04
  variables:
    DEBIAN_FRONTEND: noninteractive
  cache:
    key:
      files:
        - src-tauri/Cargo.toml
    paths:
      - .cargo/
      - src-tauri/target/

# Base job for Node.js-based jobs with common setup
.base-nodejs: &base_nodejs
  image: node:22-bookworm
  cache:
    key:
      files:
        - package-lock.json
        - bun.lock
    paths:
      - .npm/

# =============================================================================
# VERIFY STAGE (Build Checks, Linting, Tests)
# =============================================================================

verify:rust:
  stage: verify
  extends: .base-ubuntu
  before_script:
    - apt-get update && apt-get install -y ca-certificates curl wget file gnupg build-essential libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
    - mkdir -p /etc/apt/keyrings
    - curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
    - echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_22.x nodistro main" > /etc/apt/sources.list.d/nodesource.list
    - apt-get update && apt-get install -y nodejs
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --component clippy
    - export PATH="$CARGO_HOME/bin:$PATH"
  script:
    - export PATH="$CARGO_HOME/bin:$PATH"
    - node scripts/prepare-desktop.mjs --sidecar-only
    - mkdir -p src-tauri/standalone-server
    - touch src-tauri/standalone-server/.ci-placeholder
    - cargo check --manifest-path src-tauri/Cargo.toml --all-targets
    - cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
    - cargo test --manifest-path src-tauri/Cargo.toml
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"

verify:web:
  stage: verify
  extends: .base-nodejs
  script:
    - *install_js_deps
    - npm run tauri:build
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"

# =============================================================================
# PACKAGE STAGE (Bundle for Distribution)
# =============================================================================

package:web:
  stage: package
  extends: .base-nodejs
  needs:
    - job: verify:rust
      artifacts: true
    - job: verify:web
      artifacts: true
  script:
    - *install_js_deps